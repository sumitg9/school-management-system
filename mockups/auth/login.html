<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - School Management System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gradient-to-br from-blue-500 to-indigo-600 min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md">
        <!-- Login Card -->
        <div class="bg-white rounded-2xl shadow-2xl overflow-hidden">
            <!-- Header -->
            <div class="bg-gradient-to-r from-blue-600 to-indigo-600 p-8 text-center">
                <div class="w-20 h-20 bg-white rounded-full mx-auto mb-4 flex items-center justify-center">
                    <i class="fas fa-graduation-cap text-blue-600 text-3xl"></i>
                </div>
                <h1 class="text-2xl font-bold text-white mb-2">School Management System</h1>
                <p class="text-blue-100">Sign in to your account</p>
            </div>

            <!-- Login Form -->
            <div class="p-8">
                <form>
                    <!-- Email/Username -->
                    <div class="mb-6">
                        <label for="email" class="block text-gray-700 font-semibold mb-2">
                            <i class="fas fa-envelope text-gray-400 mr-2"></i>Email or Username
                        </label>
                        <input 
                            type="text" 
                            id="email" 
                            name="email" 
                            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition"
                            placeholder="Enter your email or username"
                            required
                        >
                    </div>

                    <!-- Password -->
                    <div class="mb-6">
                        <label for="password" class="block text-gray-700 font-semibold mb-2">
                            <i class="fas fa-lock text-gray-400 mr-2"></i>Password
                        </label>
                        <div class="relative">
                            <input 
                                type="password" 
                                id="password" 
                                name="password" 
                                class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition"
                                placeholder="Enter your password"
                                required
                            >
                            <button type="button" class="absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-400 hover:text-gray-600">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Remember Me & Forgot Password -->
                    <div class="flex items-center justify-between mb-6">
                        <label class="flex items-center">
                            <input type="checkbox" class="w-4 h-4 text-blue-600 border-gray-300 rounded focus:ring-blue-500">
                            <span class="ml-2 text-sm text-gray-600">Remember me</span>
                        </label>
                        <a href="forgot-password.html" class="text-sm text-blue-600 hover:text-blue-800 hover:underline">
                            Forgot password?
                        </a>
                    </div>

                    <!-- Login Button -->
                    <button 
                        type="submit" 
                        class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 text-white font-semibold py-3 rounded-lg hover:from-blue-700 hover:to-indigo-700 transition duration-300 shadow-lg hover:shadow-xl transform hover:-translate-y-0.5"
                    >
                        <i class="fas fa-sign-in-alt mr-2"></i>Sign In
                    </button>
                </form>

                <!-- Divider -->
                <div class="relative my-6">
                    <div class="absolute inset-0 flex items-center">
                        <div class="w-full border-t border-gray-300"></div>
                    </div>
                    <div class="relative flex justify-center text-sm">
                        <span class="px-4 bg-white text-gray-500">Or continue with</span>
                    </div>
                </div>

                <!-- Social Login -->
                <div class="grid grid-cols-2 gap-4 mb-6">
                    <button class="flex items-center justify-center px-4 py-2 border border-gray-300 rounded-lg hover:bg-gray-50 transition">
                        <i class="fab fa-google text-red-500 mr-2"></i>
                        <span class="text-sm font-medium text-gray-700">Google</span>
                    </button>
                    <button class="flex items-center justify-center px-4 py-2 border border-gray-300 rounded-lg hover:bg-gray-50 transition">
                        <i class="fab fa-microsoft text-blue-500 mr-2"></i>
                        <span class="text-sm font-medium text-gray-700">Microsoft</span>
                    </button>
                </div>

                <!-- Register Link -->
                <p class="text-center text-sm text-gray-600">
                    Don't have an account? 
                    <a href="register.html" class="text-blue-600 hover:text-blue-800 font-semibold hover:underline">
                        Sign up
                    </a>
                </p>
            </div>
        </div>

        <!-- Quick Access -->
        <div class="mt-6 bg-white bg-opacity-20 backdrop-blur-sm rounded-lg p-4">
            <p class="text-white text-sm font-semibold mb-3 text-center">Quick Access (Demo)</p>
            <div class="grid grid-cols-2 gap-2">
                <button class="bg-white bg-opacity-30 hover:bg-opacity-40 text-white text-xs py-2 px-3 rounded transition">
                    <i class="fas fa-user-shield mr-1"></i>Admin
                </button>
                <button class="bg-white bg-opacity-30 hover:bg-opacity-40 text-white text-xs py-2 px-3 rounded transition">
                    <i class="fas fa-chalkboard-teacher mr-1"></i>Teacher
                </button>
                <button class="bg-white bg-opacity-30 hover:bg-opacity-40 text-white text-xs py-2 px-3 rounded transition">
                    <i class="fas fa-user-graduate mr-1"></i>Student
                </button>
                <button class="bg-white bg-opacity-30 hover:bg-opacity-40 text-white text-xs py-2 px-3 rounded transition">
                    <i class="fas fa-users mr-1"></i>Parent
                </button>
            </div>
        </div>

        <!-- Back to Index -->
        <div class="mt-4 text-center">
            <a href="../index.html" class="text-white hover:text-blue-100 text-sm">
                <i class="fas fa-arrow-left mr-2"></i>Back to Mockups Index
            </a>
        </div>
    </div>

    <!-- Footer -->
    <div class="fixed bottom-4 left-0 right-0 text-center text-white text-sm">
        <p>&copy; 2025 School Management System. All rights reserved.</p>
    </div>
</body>
</html>
